[package]
name = "baker"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "=1.0.80"
base64 = "=0.22.1"
headless_chrome = {git = "https://github.com/rust-headless-chrome/rust-headless-chrome", rev = "c9ad54618c0f8a4feb79ca49e99b360a5b3988e2", features = ["fetch"]}
url = "=2.5.4"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
serde_yaml = "=0.9.34"
tracing = "=0.1.37"
tracing-subscriber = { version = "=0.3.6", features = ["fmt", "env-filter", "time", "json"] }
