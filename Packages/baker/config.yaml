# single-map crawl config for local debate-slice testing. this origin also defines crawl scope: accepted urls must use the same scheme,
# host, and port. the frontend must already be running here.
root_url: http://localhost:5101

# launch chrome without a visible window when true. this is read only when the
# baker starts, so changing it requires a normal stop and resume.
headless: true

# crawl seeds. / starts the general site crawl, while /debates exposes the
# listing links that lead the crawler into the selected map.
start_paths:
  - /
  - /debates

# on a resume, re-bake these discovery pages even when they were already ready.
# any newly exposed links join the saved frontier only when visit_policy permits.
revisit_paths_on_resume:
  - /
  - /debates
  - /debates/all

# these parameters are added only when an accepted url is dispatched to chrome, they select production data and make the app expose crawler-only links and slices
query_params:
  db: prod
  internalCrawler: "1"

# dedicated chrome tabs for urls that do not belong to an isolated group, this value is hot-reloaded; lowering it retires surplus regular tabs after
# their current page..isolated tabs are configured separately below.
#
# maximum tabs = regular_crawler_count + (max_active_groups * max_tabs_per_group)
# this config: 6 + (1 * 6) = 12 maximum tabs.
regular_crawler_count: 6

# retry a failed page this many times before recording a terminal failure.
max_retries: 3

# output directory. runs resume its crawl state by default, --force-restart deletes the directory and starts a clean bake.
base_output_dir: ./static

# local preview server for files as they are baked....html is stored brotli-compressed under normal index.html names, so this server
# supplies the content-encoding header browsers need to decode it.
serve:
  enabled: true
  host: 127.0.0.1
  port: 8787

visit_policy:
  # optional allowlist. rule kinds: exact, starts_with, not_starts_with,
  # contains, and ends_with. this permits every same-origin path outside the
  # debates subtree, then adds back only the debate listings and selected map.
  allow_paths:
    # /database, /forum, and every other non-debate path remain crawlable.
    - kind: not_starts_with
      value: /debates/

    # these listing routes expose the selected map's crawlable link.
    - kind: exact
      value: /debates
    - kind: exact
      value: /debates/all

    # accept the canonical id route and every descendant slice below it.
    - kind: exact
      value: /debates/SC8x0d_SQqOdFdadhFcqhQ
    - kind: starts_with
      value: /debates/SC8x0d_SQqOdFdadhFcqhQ/

    # accept the slugged route too because the live app may emit or normalize to it.
    - kind: exact
      value: /debates/how-old-is-the-universe.SC8x0d_SQqOdFdadhFcqhQ
    - kind: starts_with
      value: /debates/how-old-is-the-universe.SC8x0d_SQqOdFdadhFcqhQ/

  # matching child routes move into a worker pool separate from regular crawlers.
  # routes are grouped from parent plus child_depth; tabs in the same derived
  # group share one frontier so each discovered slice is baked only once.
  isolated_crawl_groups:
    # maximum derived groups that may run simultaneously. the allowlist permits
    # only one map, so no second debate group needs a slot.
    max_active_groups: 1

    # maximum tabs working inside the active group. all six claim distinct
    # descendant slices from its shared frontier.
    max_tabs_per_group: 6

    # url families that should use the isolated worker pool.
    routes:
      # /debates and each depth-one /debates/x group root remain on regular tabs.
      # every deeper descendant of x stays in the same isolated group.
      - parent: /debates
        child_depth: 1

  # optional denylist; it overrides allow_paths when both match.
  # exclude_paths:
  #   - kind: starts_with
  #     value: /draft
