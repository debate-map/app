# Local preview server for files as they are baked.
serve:
  enabled: true
  host: 127.0.0.1
  port: 8787

# Site origin/scope. Use http://localhost:5101 for local dev.
root_url: http://localhost:5101

# Crawl seeds. Remove this to start at root_url.
start_paths:
  - /database
  - /database/users
  - /database/terms
  - /debates

# Added to every accepted URL when the browser visits it. These select the
# production dataset and expose crawlable SPA links without changing URL scope.
query_params:
  db: prod
  internalCrawler: "1"

# Dedicated Chrome tabs for URLs that do not belong to an isolated group.
# This value is hot-reloaded; lowering it retires surplus regular tabs after
# their current page. Isolated tabs are configured separately below.
#
# Maximum crawler tabs = regular_crawler_count + (isolated_crawl_groups.max_active_groups * isolated_crawl_groups.max_tabs_per_group)
# This config: 6 + (3 * 6) = 24 maximum crawler tabs.
regular_crawler_count: 6

# Retry a page this many times before skipping it.
max_retries: 3

# Output dir. Resumed by default; pass --force-restart to delete and rebuild it.
base_output_dir: ./static

visit_policy:
  # Optional allowlist. Rule kinds: exact, starts_with, contains, ends_with.
  # Empty means every same-origin path is allowed.
  allow_paths:
    - kind: exact
      value: /database
    - kind: exact
      value: /database/users
    - kind: starts_with
      value: /database/users/
    - kind: exact
      value: /database/terms
    - kind: starts_with
      value: /database/terms/
    - kind: exact
      value: /debates
    - kind: starts_with
      value: /debates/

  # Isolated crawl groups move matching child routes into a worker pool separate
  # from regular crawlers. Routes are grouped by parent and child_depth; tabs in
  # the same derived group share work so every discovered URL is baked once.
  # Example: /database/terms/... can be one group while /debates/X/... and
  # /debates/Y/... are two other groups running at the same time.
  isolated_crawl_groups:
    # Maximum derived groups running simultaneously across all routes below.
    # Example: terms, debate X, and debate Y may run; debate Z waits for a slot.
    max_active_groups: 3
    # Maximum tabs working inside each active group.
    # Six tabs divide the queued URLs belonging to the same debate or term group.
    max_tabs_per_group: 6
    # URL families that should use the isolated worker pool.
    # Example: only descendants of /database/terms and /debates match here.
    routes:
      # Base path used to derive the terms group. The parent itself remains regular.
      - parent: /database/terms
        # Depth 0 uses /database/terms as every terms-group tab's starting view.
        child_depth: 0
      # Base path used to derive debate groups. The parent itself remains regular.
      - parent: /debates
        # Depth 1 makes every X-group tab enter /debates/X through the /debates
        # SPA first; /debates/Y is a separate group with the same bootstrap flow.
        child_depth: 1

  # Optional denylist; overrides allow_paths.
  # exclude_paths:
  #   - kind: starts_with
  #     value: /draft
